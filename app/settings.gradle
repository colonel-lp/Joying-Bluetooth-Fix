pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
// Java 25 requires Gradle 9.1+. AGP 8.x cannot load on Gradle 9.6+.
// The distribution file selects the tested Gradle 9.3.1 / AGP 8.13 pairing.
def runningGradle = org.gradle.util.GradleVersion.current().baseVersion
if (runningGradle < org.gradle.util.GradleVersion.version('9.1') ||
        runningGradle >= org.gradle.util.GradleVersion.version('9.6')) {
    throw new GradleException('Use the gradle-wrapper.properties distribution (Gradle 9.3.1) with your Gradle JVM 25. This project supports Gradle 9.1 through 9.5 with AGP 8.13.2; Gradle 9.6+ requires a newer Android plugin.')
}

rootProject.name = 'JoyingBluetoothControls'
