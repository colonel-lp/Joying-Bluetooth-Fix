plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'com.joying.bluetoothsettings'
    compileSdk 35

    defaultConfig {
        applicationId 'com.joying.bluetoothsettings'
        minSdk 21
        targetSdk 27
        versionCode 8
        versionName '1.7'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        // This controller is sideloaded on an Android 8.1 head unit.
        disable 'ExpiredTargetSdkVersion'
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.all {
        outputFileName = "BluetoothControls-${variant.name}.apk"
    }
}
